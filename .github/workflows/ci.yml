# Checks, tests and builds. Runs on pushes to main and on pull requests.
# No secrets are used here, so untrusted pull requests cannot reach deploy or signing credentials.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (worker + web)
        run: npm run typecheck
      - name: Tests (Workers runtime + D1, no network)
        run: npm test
      - name: Build PWA
        run: npm run build:web
      - name: Build Android web bundle
        run: npx vite build --mode capacitor
        env:
          VITE_API_BASE: https://example.invalid
